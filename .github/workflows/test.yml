name: Test & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:coverage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Publish coverage summary
        run: |
          echo "## Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          jq -r 'to_entries[] | select(.key != "total") | "| \(.key | ascii_upcase) | \(.value.pct)% |"' coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
          TOTAL=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          echo "| **TOTAL** | **${TOTAL}%** |" >> "$GITHUB_STEP_SUMMARY"
          echo ""
          echo "Coverage total lines: ${TOTAL}%"
          echo "COVERAGE_TOTAL=${TOTAL}" >> "$GITHUB_ENV"
          if (( $(echo "$TOTAL >= 80" | bc -l) )); then
            echo "COVERAGE_COLOR=brightgreen" >> "$GITHUB_ENV"
          elif (( $(echo "$TOTAL >= 60" | bc -l) )); then
            echo "COVERAGE_COLOR=green" >> "$GITHUB_ENV"
          elif (( $(echo "$TOTAL >= 40" | bc -l) )); then
            echo "COVERAGE_COLOR=yellow" >> "$GITHUB_ENV"
          else
            echo "COVERAGE_COLOR=red" >> "$GITHUB_ENV"
          fi

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
