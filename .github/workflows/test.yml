name: Test & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:coverage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Publish coverage summary
        run: |
          echo "## Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          jq -r 'to_entries[] | select(.key != "total") | "| \(.key | ascii_upcase) | \(.value.lines.pct)% |"' coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
          TOTAL=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          echo "| **TOTAL** | **${TOTAL}%** |" >> "$GITHUB_STEP_SUMMARY"
          echo ""
          echo "Coverage total lines: ${TOTAL}%"
          echo "COVERAGE_TOTAL=${TOTAL}" >> "$GITHUB_ENV"
          if (( $(echo "$TOTAL >= 80" | bc -l) )); then
            echo "COVERAGE_COLOR=brightgreen" >> "$GITHUB_ENV"
          elif (( $(echo "$TOTAL >= 60" | bc -l) )); then
            echo "COVERAGE_COLOR=green" >> "$GITHUB_ENV"
          elif (( $(echo "$TOTAL >= 40" | bc -l) )); then
            echo "COVERAGE_COLOR=yellow" >> "$GITHUB_ENV"
          else
            echo "COVERAGE_COLOR=red" >> "$GITHUB_ENV"
          fi

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const t = summary.total;
            const pct = t.lines.pct;
            const color = pct >= 80 ? 'brightgreen' : pct >= 60 ? 'green' : pct >= 40 ? 'yellow' : 'red';
            const marker = '<!-- coverage-report-comment -->';
            const body = `${marker}
            ## 📊 Coverage Report

            ![coverage](https://img.shields.io/badge/coverage-${pct}%25-${color})

            | Metric | Covered | Total | % |
            |--------|---------|-------|---|
            | Lines       | ${t.lines.covered}       | ${t.lines.total}       | **${t.lines.pct}%** |
            | Statements  | ${t.statements.covered}  | ${t.statements.total}  | ${t.statements.pct}% |
            | Functions   | ${t.functions.covered}   | ${t.functions.total}   | ${t.functions.pct}% |
            | Branches    | ${t.branches.covered}    | ${t.branches.total}    | ${t.branches.pct}% |

            _Full HTML report available in the workflow artifacts (\`coverage-report\`)._`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
